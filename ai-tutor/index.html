<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Kod Öğretmen - JavaScript & React</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-robot"></i>
                <h1>AI Kod Öğretmen</h1>
            </div>
            <div class="user-stats">
                <div class="stat">
                    <i class="fas fa-star"></i>
                    <span id="totalScore">0</span> Puan
                </div>
                <div class="stat">
                    <i class="fas fa-layer-group"></i>
                    <span id="currentLevel">Başlangıç</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left Panel - AI Görevler -->
            <div class="panel left-panel">
                <div class="panel-header">
                    <h2><i class="fas fa-tasks"></i> Görev</h2>
                    <div class="difficulty-badge" id="difficultyBadge">
                        <span id="difficultyLevel">Kolay</span>
                        <span id="difficultyPoints">+10 puan</span>
                    </div>
                </div>
                <div class="panel-content" id="taskContent">
                    <div class="loading">
                        <i class="fas fa-circle-notch fa-spin"></i>
                        <p>AI görev hazırlıyor...</p>
                    </div>
                </div>
                <div class="panel-footer">
                    <button class="btn btn-primary" id="newTaskBtn">
                        <i class="fas fa-plus"></i> Yeni Görev Al
                    </button>
                    <button class="btn btn-secondary" id="hintBtn">
                        <i class="fas fa-lightbulb"></i> İpucu (-2 puan)
                    </button>
                </div>
            </div>

            <!-- Middle Panel - Kod Editörü -->
            <div class="panel middle-panel">
                <div class="panel-header">
                    <h2><i class="fas fa-code"></i> Kod Editörü</h2>
                    <div class="editor-controls">
                        <select id="languageSelect" class="language-select">
                            <option value="javascript">JavaScript</option>
                            <option value="react">React (JSX)</option>
                        </select>
                    </div>
                </div>
                <div class="panel-content editor-container">
                    <div id="editor"></div>
                </div>
                <div class="panel-footer">
                    <button class="btn btn-success" id="runCodeBtn">
                        <i class="fas fa-play"></i> Kodu Çalıştır
                    </button>
                    <button class="btn btn-info" id="submitBtn">
                        <i class="fas fa-paper-plane"></i> AI'ya Gönder
                    </button>
                    <button class="btn btn-warning" id="clearBtn">
                        <i class="fas fa-eraser"></i> Temizle
                    </button>
                </div>
            </div>

            <!-- Right Panel - Konsol & AI Feedback -->
            <div class="panel right-panel">
                <div class="panel-header">
                    <h2><i class="fas fa-terminal"></i> Konsol & AI Feedback</h2>
                    <button class="btn-icon" id="clearConsoleBtn" title="Konsolu Temizle">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
                <div class="panel-content console-container" id="consoleOutput">
                    <div class="console-welcome">
                        <i class="fas fa-info-circle"></i>
                        <p>Kodunuzu çalıştırdığınızda sonuçlar burada görünecek...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- API Key Modal -->
    <div id="apiKeyModal" class="modal">
        <div class="modal-content">
            <h2><i class="fas fa-key"></i> Gemini API Anahtarı</h2>
            <p>Google Gemini API anahtarınızı girin:</p>
            <input type="password" id="apiKeyInput" placeholder="AIza...">
            <p class="small-text">
                <i class="fas fa-info-circle"></i>
                API anahtarı almak için:
                <a href="https://makersuite.google.com/app/apikey" target="_blank">
                    Google AI Studio
                </a>
            </p>
            <button class="btn btn-primary" id="saveApiKeyBtn">
                <i class="fas fa-save"></i> Kaydet
            </button>
        </div>
    </div>

    <!-- Monaco Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script src="gemini-service.js"></script>
    <script src="app.js"></script>
</body>
</html>
